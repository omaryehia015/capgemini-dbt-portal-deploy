# execution: the API (stateless, queues dbt jobs) and the workers that run
# them. Scale the API for users, the workers for concurrent dbt runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-portal-execution
  labels: { app: dbt-portal, component: execution }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dbt-portal, component: execution }
  template:
    metadata:
      labels: { app: dbt-portal, component: execution }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: execution
          image: capgemini-dbt-portal-backend
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: dbt-portal-config }
            - secretRef: { name: dbt-portal-secrets }
          env:
            - { name: PORTAL_SERVICES, value: execution }
            - { name: EXECUTION_ROLE, value: api }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: dbt-portal-secrets, key: DATABASE_URL_EXECUTION } }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: data, mountPath: /data }
          # Git clone + dbt deps happen before uvicorn listens.
          startupProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: workspace
          persistentVolumeClaim: { claimName: dbt-portal-workspace }
        # The dbt editor's trash only.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-portal-execution
  labels: { app: dbt-portal, component: execution }
spec:
  selector: { app: dbt-portal, component: execution }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-portal-worker
  labels: { app: dbt-portal, component: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: dbt-portal, component: worker }
  template:
    metadata:
      labels: { app: dbt-portal, component: worker }
    spec:
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      # Lets a running dbt step finish on scale-down or rollout.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: capgemini-dbt-portal-backend
          args: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: { name: dbt-portal-config }
            - secretRef: { name: dbt-portal-secrets }
          env:
            - { name: PORTAL_SERVICES, value: execution }
            # The execution API clones the project; workers only mount it.
            - { name: DBT_PROJECT_GIT_URL, value: "" }
            - { name: WORKER_CONCURRENCY, value: "4" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: dbt-portal-secrets, key: DATABASE_URL_EXECUTION } }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
          livenessProbe:
            exec: { command: ["python", "-m", "app.worker", "--check"] }
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 4Gi }
      volumes:
        - name: workspace
          persistentVolumeClaim: { claimName: dbt-portal-workspace }
