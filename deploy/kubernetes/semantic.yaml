# semantic: the semantic layer's control plane. Keeps the warehouse login and
# the Cube data model on its volume and serves them to Cube over HTTP. One
# replica: the model is written as files (ReadWriteOnce volume).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-portal-semantic
  labels: { app: dbt-portal, component: semantic }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: dbt-portal, component: semantic }
  template:
    metadata:
      labels: { app: dbt-portal, component: semantic }
    spec:
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: semantic
          image: capgemini-dbt-portal-semantic
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: dbt-portal-config }
            - secretRef: { name: dbt-portal-secrets }
          env:
            - { name: DBT_PROJECT_GIT_URL, value: "" }
          volumeMounts:
            - { name: workspace, mountPath: /workspace, readOnly: true }
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: workspace
          persistentVolumeClaim: { claimName: dbt-portal-workspace }
        - name: data
          persistentVolumeClaim: { claimName: dbt-portal-semantic-data }
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-portal-semantic
  labels: { app: dbt-portal, component: semantic }
spec:
  selector: { app: dbt-portal, component: semantic }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbt-portal-semantic-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
