# Per-client install of the portal:
#   1. cp secrets.env.example secrets.env   (git-ignored) and fill it in
#   2. edit portal.env (non-secret settings) and the image tags below
#      (releases.yml lists the versions released together)
#   3. kubectl apply -k deploy/kubernetes
#   4. kubectl -n dbt-portal logs deploy/dbt-portal-backend   -> first-login passwords
#
# PostgreSQL and Redis are included as single-pod defaults (data-stores.yaml).
# In production use the platform's managed ones: delete data-stores.yaml from
# `resources`, then point DATABASE_URL and REDIS_URL in secrets.env at them.
#
# Full walkthrough: docs/ONBOARDING.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dbt-portal

resources:
  - namespace.yaml
  - data-stores.yaml
  - workspace.yaml
  - backend.yaml
  - worker.yaml
  - cube.yaml
  - frontend.yaml
  - ingress.yaml

configMapGenerator:
  - name: dbt-portal-config
    envs:
      - portal.env

secretGenerator:
  - name: dbt-portal-secrets
    envs:
      - secrets.env

# Images in the client's registry (see docs/ONBOARDING.md, step 3).
images:
  - name: capgemini-dbt-portal-backend
    newName: ghcr.io/omaryehia015/capgemini-dbt-portal-backend
    newTag: "1.0.0"
  - name: capgemini-dbt-portal-cube
    newName: ghcr.io/omaryehia015/capgemini-dbt-portal-cube
    newTag: "1.0.0"
  - name: capgemini-dbt-portal-frontend
    newName: ghcr.io/omaryehia015/capgemini-dbt-portal-frontend
    newTag: "1.0.0"
