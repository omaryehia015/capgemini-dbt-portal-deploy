# insights: the read side (Elementary, SQLFluff, profiler, assets, FinOps,
# Ask AI). Stateless; reads the dbt project's artifacts and the warehouse.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-portal-insights
  labels: { app: dbt-portal, component: insights }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dbt-portal, component: insights }
  template:
    metadata:
      labels: { app: dbt-portal, component: insights }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: insights
          image: capgemini-dbt-portal-insights
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: dbt-portal-config }
            - secretRef: { name: dbt-portal-secrets }
          env:
            - { name: DBT_PROJECT_GIT_URL, value: "" }
          volumeMounts:
            - { name: workspace, mountPath: /workspace, readOnly: true }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: workspace
          persistentVolumeClaim: { claimName: dbt-portal-workspace }
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-portal-insights
  labels: { app: dbt-portal, component: insights }
spec:
  selector: { app: dbt-portal, component: insights }
  ports: [{ port: 8000, targetPort: 8000 }]
