# The gateway: nginx serving the SPA and routing each /api prefix (incl. the
# job log WebSocket) to the service that owns it. Stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-portal-frontend
  labels: { app: dbt-portal, component: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dbt-portal, component: frontend }
  template:
    metadata:
      labels: { app: dbt-portal, component: frontend }
    spec:
      containers:
        - name: frontend
          image: capgemini-dbt-portal-frontend
          ports:
            - containerPort: 8080
          env:
            - { name: IDENTITY_UPSTREAM, value: "dbt-portal-identity:8000" }
            - { name: EXECUTION_UPSTREAM, value: "dbt-portal-execution:8000" }
            - { name: INSIGHTS_UPSTREAM, value: "dbt-portal-insights:8000" }
            - { name: SEMANTIC_UPSTREAM, value: "dbt-portal-semantic:8000" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-portal-frontend
  labels: { app: dbt-portal, component: frontend }
spec:
  selector: { app: dbt-portal, component: frontend }
  ports:
    - port: 8080
      targetPort: 8080
