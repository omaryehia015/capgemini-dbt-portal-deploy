# Optional: VS Code for the developers (the backend repo's ide/hub.py). One
# code-server per developer, each as a Linux user of their own, opened from
# dbt Development and the DAG Studio and served by the frontend under /ide/.
#
# To turn it on:
#   1. add ide.yaml to `resources` in kustomization.yaml
#   2. portal.env:   IDE_URL=http://dbt-portal-ide:8090
#                    IDE_UPSTREAM=dbt-portal-ide:8090
#   3. secrets.env:  IDE_SECRET=<openssl rand -base64 36>
#
# It runs as root with six capabilities (to start each developer's processes as
# their own user) and no privilege escalation: the namespace's Pod Security
# level must be `baseline`, not `restricted`. It gets IDE_SECRET only, never the
# portal's other secrets, and only the frontend and the backend may reach it.
# One replica: the developers' sessions live in this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-portal-ide
  labels: { app: dbt-portal, component: ide }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: dbt-portal, component: ide }
  template:
    metadata:
      labels: { app: dbt-portal, component: ide }
    spec:
      containers:
        - name: ide
          image: capgemini-dbt-portal-ide
          ports: [{ containerPort: 8090 }]
          env:
            - name: IDE_SECRET
              valueFrom: { secretKeyRef: { name: dbt-portal-secrets, key: IDE_SECRET } }
            - name: IDE_MAX_SESSIONS
              valueFrom: { configMapKeyRef: { name: dbt-portal-config, key: IDE_MAX_SESSIONS, optional: true } }
            - name: IDE_IDLE_MINUTES
              valueFrom: { configMapKeyRef: { name: dbt-portal-config, key: IDE_IDLE_MINUTES, optional: true } }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
          volumeMounts:
            - { name: homes, mountPath: /home/portal }
          readinessProbe:
            httpGet: { path: /_hub/health, port: 8090 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /_hub/health, port: 8090 }
            periodSeconds: 30
          # About 1 GB per developer with VS Code open.
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 6Gi }
      volumes:
        - name: homes
          persistentVolumeClaim: { claimName: dbt-portal-ide-homes }
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-portal-ide
  labels: { app: dbt-portal, component: ide }
spec:
  selector: { app: dbt-portal, component: ide }
  ports: [{ port: 8090, targetPort: 8090 }]
---
# The developers' homes: their clones, settings and extensions.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbt-portal-ide-homes
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 20Gi }
---
# Only the gateway (the developers' browsers) and the backend (opening sessions) reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dbt-portal-ide
spec:
  podSelector:
    matchLabels: { app: dbt-portal, component: ide }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: dbt-portal, component: frontend } }
        - podSelector: { matchLabels: { app: dbt-portal, component: backend } }
      ports: [{ port: 8090 }]
