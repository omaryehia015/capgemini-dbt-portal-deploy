# identity: sign-in, sessions, users and roles, audit trail. Stateless (state
# is in PostgreSQL, sign-in codes in Redis), so it scales horizontally.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-portal-identity
  labels: { app: dbt-portal, component: identity }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dbt-portal, component: identity }
  template:
    metadata:
      labels: { app: dbt-portal, component: identity }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: identity
          image: capgemini-dbt-portal-identity
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: dbt-portal-config }
            - secretRef: { name: dbt-portal-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: dbt-portal-secrets, key: DATABASE_URL_IDENTITY } }
            - { name: DBT_PROJECT_GIT_URL, value: "" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-portal-identity
  labels: { app: dbt-portal, component: identity }
spec:
  selector: { app: dbt-portal, component: identity }
  ports: [{ port: 8000, targetPort: 8000 }]
