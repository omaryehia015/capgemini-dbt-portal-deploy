# FastAPI backend. ONE replica with the default SQLite database (a
# ReadWriteOnce volume cannot be shared). With DATABASE_URL pointing at
# PostgreSQL, more replicas work: jobs, schedules, sessions and lockouts are
# coordinated through the database (see docs/ONBOARDING.md section 9).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-portal-backend
  labels: { app: dbt-portal, component: backend }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: dbt-portal, component: backend }
  template:
    metadata:
      labels: { app: dbt-portal, component: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: capgemini-dbt-portal-backend
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: dbt-portal-config }
            - secretRef: { name: dbt-portal-secrets }
          env:
            - name: DBT_PROJECT_DIR
              value: /workspace
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: data, mountPath: /data }
            # Uncomment with the dbt-profiles volume below, and set
            # DBT_PROFILES_DIR=/etc/dbt in portal.env.
            # - { name: dbt-profiles, mountPath: /etc/dbt, readOnly: true }
          # Git clone + dbt deps happen before uvicorn listens.
          startupProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
      volumes:
        # Git mode: a fresh clone on every pod start.
        - name: workspace
          emptyDir: {}
        # Shared-volume mode (the client's dbt job already writes the project
        # to a ReadWriteMany PVC): replace the emptyDir above with
        #   persistentVolumeClaim: { claimName: <client-dbt-project-pvc> }
        # and remove DBT_PROJECT_GIT_URL from portal.env.
        - name: data
          persistentVolumeClaim:
            claimName: dbt-portal-data
        # - name: dbt-profiles
        #   secret:
        #     secretName: dbt-profiles   # kubectl create secret generic dbt-profiles --from-file=profiles.yml
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-portal-backend
  labels: { app: dbt-portal, component: backend }
spec:
  selector: { app: dbt-portal, component: backend }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbt-portal-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
