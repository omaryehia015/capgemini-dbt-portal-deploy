# Cube, the semantic engine. Stateless: it reads its warehouse login and data
# model from the backend, so it can be scaled and restarted freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-portal-cube
  labels: { app: dbt-portal, component: cube }
spec:
  replicas: 1
  selector:
    matchLabels: { app: dbt-portal, component: cube }
  template:
    metadata:
      labels: { app: dbt-portal, component: cube }
    spec:
      containers:
        - name: cube
          image: capgemini-dbt-portal-cube
          # 15432: the SQL API for BI tools and agents (per-user logins from the
          # Semantic Layer page, checked by the backend).
          ports: [{ containerPort: 4000 }, { containerPort: 15432, name: sql }]
          env:
            - name: CUBEJS_API_SECRET
              valueFrom: { secretKeyRef: { name: dbt-portal-secrets, key: CUBE_API_SECRET } }
            - { name: PORTAL_SEMANTIC_URL, value: "http://dbt-portal-backend:8000" }
          readinessProbe:
            httpGet: { path: /readyz, port: 4000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /livez, port: 4000 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-portal-cube
  labels: { app: dbt-portal, component: cube }
spec:
  selector: { app: dbt-portal, component: cube }
  ports:
    - { name: api, port: 4000, targetPort: 4000 }
    # In-cluster only. For BI tools outside the cluster, expose it with an
    # internal LoadBalancer (or NodePort) and set CUBE_SQL_HOST / CUBE_SQL_PORT
    # on the backend to the address users connect to.
    - { name: sql, port: 15432, targetPort: 15432 }
