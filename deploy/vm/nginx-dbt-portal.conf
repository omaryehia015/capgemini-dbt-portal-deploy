# nginx site for a Linux VM without containers. Serves the built SPA
# (frontend/dist copied to /var/www/dbt-portal) and proxies /api to the local
# backend. Same routing as frontend/nginx/default.conf.template.
#   sudo cp deploy/vm/nginx-dbt-portal.conf /etc/nginx/conf.d/dbt-portal.conf
#   sudo nginx -t && sudo systemctl reload nginx
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /var/www/dbt-portal;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
