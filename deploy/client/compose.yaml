# What a client actually runs. No source code, no Dockerfiles, no build step
# -- these are the same two images every client runs, pulled from the
# registry. The ONLY thing specific to this install is which dbt project is
# mounted at /workspace; that project's own `.env` (next to its
# `profiles.yml`) supplies the warehouse credentials, so there is normally
# nothing else to configure. See README.md in this folder for the 3-command
# quickstart, and docs/ONBOARDING.md (in the app's repo) for Kubernetes, a
# git-cloned project instead of a mount, a non-Snowflake warehouse image, etc.
services:
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/OWNER/REPO}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Non-root by default. Windows/macOS bind mounts (Podman/Docker Desktop) show
    # every file as root-owned and refuse chmod/utime from other users, which
    # makes `dbt deps` fail ("Operation not permitted"). scripts/onboard sets
    # PORTAL_USER=0:0 on those hosts; leave it alone on Linux.
    user: "${PORTAL_USER:-10001:10001}"
    environment:
      DBT_PROJECT_DIR: /workspace
      # Random per-account passwords, generated on first start and printed
      # once to `docker compose logs backend` -- see README.md.
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      # The client's dbt project (the folder with dbt_project.yml in it).
      # Unset (git mode instead): the entrypoint clones DBT_PROJECT_GIT_URL
      # into this same named volume on first start.
      - ${DBT_PROJECT_PATH:-workspace}:/workspace
      # Portal accounts, audit log, run history, and the auto-generated
      # session secret. Survives restarts and upgrades.
      - portal_data:/data
    env_file:
      # Optional: only needed for settings that aren't in the dbt project's
      # own .env -- DBT_PROJECT_GIT_URL, a non-default DATABASE_URL, etc.
      # Safe to leave this file absent.
      - path: .env
        required: false
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/OWNER/REPO}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORTAL_PORT:-8080}:8080"

volumes:
  portal_data:
  workspace:
