{{- if .Values.secrets.create }}
{{- /*
Development: the chart builds the Secret. Values come from secrets.values; JWT_SECRET,
CUBE_API_SECRET, PORTAL_SECRET_KEY and the bundled services' passwords are generated the first
time and then read back from the live Secret (lookup), so an upgrade never changes them.
`helm template` has no cluster to look at and generates new values each time: do not apply its
output. Production uses secrets.create=false and a Secret you manage.
*/ -}}
{{- $name := include "dbt-portal.secretName" . }}
{{- $old := dict }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $live }}
{{- $old = $live.data | default dict }}
{{- end }}
{{- $data := dict }}
{{- range $key, $value := .Values.secrets.values }}
{{- $_ := set $data $key ($value | toString | b64enc) }}
{{- end }}
{{- /* PORTAL_SECRET_KEY is a Fernet key: URL-safe base64 of 32 bytes (here, of 32 characters). */ -}}
{{- $generated := dict
    "JWT_SECRET" (randAlphaNum 48 | b64enc)
    "CUBE_API_SECRET" (randAlphaNum 48 | b64enc)
    "PORTAL_SECRET_KEY" (randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" | b64enc) }}
{{- if .Values.postgresql.enabled }}
{{- $_ := set $generated "POSTGRES_PASSWORD" (randAlphaNum 32 | b64enc) }}
{{- end }}
{{- if .Values.redis.enabled }}
{{- $_ := set $generated "REDIS_PASSWORD" (randAlphaNum 32 | b64enc) }}
{{- end }}
{{- range $key, $value := $generated }}
{{- if not (hasKey $data $key) }}
{{- if hasKey $old $key }}
{{- $_ := set $data $key (index $old $key) }}
{{- else }}
{{- $_ := set $data $key $value }}
{{- end }}
{{- end }}
{{- end }}
{{- /* External services have no generated value: the connection strings must be supplied. */ -}}
{{- if not .Values.postgresql.enabled }}
{{- if not (hasKey $data "DATABASE_URL") }}
{{- if hasKey $old "DATABASE_URL" }}
{{- $_ := set $data "DATABASE_URL" (index $old "DATABASE_URL") }}
{{- else }}
{{- fail "postgresql.enabled is false, so secrets.values.DATABASE_URL is required (postgresql+psycopg2://user:password@host:5432/database)" }}
{{- end }}
{{- end }}
{{- end }}
{{- if not .Values.redis.enabled }}
{{- if not (hasKey $data "REDIS_URL") }}
{{- if hasKey $old "REDIS_URL" }}
{{- $_ := set $data "REDIS_URL" (index $old "REDIS_URL") }}
{{- else }}
{{- fail "redis.enabled is false, so secrets.values.REDIS_URL is required (redis://:password@host:6379/0)" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dbt-portal.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  {{- if .Values.persistence.retainOnUninstall }}
  annotations:
    # Kept with the claims: a retained PostgreSQL volume needs the password it was created with.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
