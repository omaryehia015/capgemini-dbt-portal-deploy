{{- $component := "frontend" }}
{{- $name := include "dbt-portal.componentName" (dict "root" . "component" $component) }}
{{- $ctx := dict "root" . "component" $component }}
{{- $v := .Values.frontend }}
# The gateway: nginx serving the SPA and proxying /api (including the job-log WebSocket) to the
# backend. Stateless, and given no secret: it has no envFrom and no secretKeyRef.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "dbt-portal.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "dbt-portal.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dbt-portal.labels" $ctx | nindent 8 }}
        {{- with $v.podLabels }}
        {{- include "dbt-portal.stringMap" . | nindent 8 }}
        {{- end }}
      {{- with $v.podAnnotations }}
      annotations:
        {{- include "dbt-portal.stringMap" . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dbt-portal.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "dbt-portal.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: {{ include "dbt-portal.image" (dict "root" . "image" $v.image) | quote }}
          imagePullPolicy: {{ include "dbt-portal.pullPolicy" (dict "root" . "image" $v.image) }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Where /api is proxied to. A short Service name gets this namespace's cluster domain appended by the image.
            - name: BACKEND_UPSTREAM
              value: {{ printf "%s:%v" (include "dbt-portal.componentName" (dict "root" . "component" "backend")) .Values.backend.service.port | quote }}
            {{- with $v.airflowUpstream }}
            - name: AIRFLOW_UPSTREAM
              value: {{ . | quote }}
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "dbt-portal.probe" (dict "name" "startupProbe" "probe" $v.probes.startup "handler" (dict "httpGet" (dict "path" "/" "port" "http"))) | nindent 10 }}
          {{- include "dbt-portal.probe" (dict "name" "readinessProbe" "probe" $v.probes.readiness "handler" (dict "httpGet" (dict "path" "/" "port" "http"))) | nindent 10 }}
          {{- include "dbt-portal.probe" (dict "name" "livenessProbe" "probe" $v.probes.liveness "handler" (dict "httpGet" (dict "path" "/" "port" "http"))) | nindent 10 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      {{- include "dbt-portal.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "dbt-portal.labels" $ctx | nindent 4 }}
  {{- with $v.service.annotations }}
  annotations:
    {{- include "dbt-portal.stringMap" . | nindent 4 }}
  {{- end }}
spec:
  # The only Service meant to be reached from outside: through the Ingress, or a port-forward.
  type: {{ $v.service.type }}
  selector:
    {{- include "dbt-portal.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
