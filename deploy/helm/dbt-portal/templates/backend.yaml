{{- $component := "backend" }}
{{- $name := include "dbt-portal.componentName" (dict "root" . "component" $component) }}
{{- $ctx := dict "root" . "component" $component }}
{{- $v := .Values.backend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "dbt-portal.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  {{- with $v.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dbt-portal.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dbt-portal.labels" $ctx | nindent 8 }}
        {{- with $v.podLabels }}
        {{- include "dbt-portal.stringMap" . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if $v.metrics.annotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $v.service.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with $v.podAnnotations }}
        {{- include "dbt-portal.stringMap" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dbt-portal.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "dbt-portal.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      containers:
        - name: {{ $component }}
          image: {{ include "dbt-portal.image" (dict "root" . "image" $v.image) | quote }}
          imagePullPolicy: {{ include "dbt-portal.pullPolicy" (dict "root" . "image" $v.image) }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            {{- include "dbt-portal.envFrom" . | nindent 12 }}
          env:
            # The API queues dbt runs for the workers (needs Redis); the worker Deployment runs them.
            - name: EXECUTION_ROLE
              value: api
            {{- if .Values.backups.persistence.enabled }}
            - name: BACKUP_DIR
              value: /backups
            {{- end }}
            # Proxies in front of the gateway that append to X-Forwarded-For (the Ingress).
            - name: FORWARDED_HOPS
              value: {{ (ternary (ternary 1 0 .Values.ingress.enabled) $v.forwardedHops (kindIs "invalid" $v.forwardedHops)) | toString | quote }}
            {{- if eq .Values.project.source "git" }}
            # Only the backend clones the project (into the shared workspace volume).
            - name: DBT_PROJECT_GIT_URL
              value: {{ .Values.project.git.url | quote }}
            - name: DBT_PROJECT_GIT_REF
              value: {{ .Values.project.git.ref | quote }}
            {{- with .Values.project.git.username }}
            - name: DBT_PROJECT_GIT_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- include "dbt-portal.sharedEnv" . | nindent 12 }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: data
              mountPath: /data
            {{- if .Values.backups.persistence.enabled }}
            - name: backups
              mountPath: /backups
            {{- end }}
            {{- include "dbt-portal.profilesMount" . | nindent 12 }}
          {{- include "dbt-portal.probe" (dict "name" "startupProbe" "probe" $v.probes.startup "handler" (dict "httpGet" (dict "path" "/api/health" "port" "http"))) | nindent 10 }}
          {{- include "dbt-portal.probe" (dict "name" "readinessProbe" "probe" $v.probes.readiness "handler" (dict "httpGet" (dict "path" "/api/health" "port" "http"))) | nindent 10 }}
          {{- include "dbt-portal.probe" (dict "name" "livenessProbe" "probe" $v.probes.liveness "handler" (dict "httpGet" (dict "path" "/api/health" "port" "http"))) | nindent 10 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "dbt-portal.claimName" (dict "root" . "component" "workspace" "persistence" .Values.workspace.persistence) }}
        # The dbt editor's trash, Cube's state, the stored-credentials key when PORTAL_SECRET_KEY is unset.
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dbt-portal.claimName" (dict "root" . "component" "data" "persistence" .Values.data.persistence) }}
        {{- if .Values.backups.persistence.enabled }}
        # The portal's own backups (a daily archive of the database and /data).
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "dbt-portal.claimName" (dict "root" . "component" "backups" "persistence" .Values.backups.persistence) }}
        {{- end }}
        {{- include "dbt-portal.profilesVolume" . | nindent 8 }}
      {{- include "dbt-portal.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "dbt-portal.labels" $ctx | nindent 4 }}
spec:
  # ClusterIP only: the API is reached through the frontend gateway.
  type: {{ $v.service.type }}
  selector:
    {{- include "dbt-portal.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
