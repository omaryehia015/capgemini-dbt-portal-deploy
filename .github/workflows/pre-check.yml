name: Pull Request Pre-Check
on:
  pull_request:
    branches: [dev, test, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['.github/workflows/**']
concurrency:
  group: pre-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.files_changed.outputs.backend }}
      frontend: ${{ steps.files_changed.outputs.frontend }}
      cube: ${{ steps.files_changed.outputs.cube }}
      components: ${{ steps.matrix.outputs.components }}
    steps:
      - uses: actions/checkout@v6
      - id: files_changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend: ['backend/**', 'ruff.toml', '.trivyignore']
            frontend: ['frontend/**', '.trivyignore']
            cube: ['cube/**', '.trivyignore']
      - id: matrix
        env:
          BACKEND: ${{ steps.files_changed.outputs.backend }}
          FRONTEND: ${{ steps.files_changed.outputs.frontend }}
          CUBE: ${{ steps.files_changed.outputs.cube }}
        run: |
          components=$(jq -cn \
            --arg backend "$BACKEND" \
            --arg frontend "$FRONTEND" \
            --arg cube "$CUBE" \
            '[if $backend == "true" then "backend" else empty end,
              if $frontend == "true" then "frontend" else empty end,
              if $cube == "true" then "cube" else empty end]')
          if [[ "$components" == "[]" ]]; then components='["none"]'; fi
          echo "components=$components" >> "$GITHUB_OUTPUT"
  promotion-path:
    runs-on: ubuntu-24.04
    steps:
      - env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BASE:$HEAD" in
            dev:feature/*|dev:feat/*|dev:bugfix/*|dev:fix/*|dev:hotfix/*|dev:chore/*|dev:dependabot/*|dev:renovate/*) ;;
            test:dev|main:test) ;;
            *) echo "::error::Invalid promotion $HEAD -> $BASE. Required path: working branch -> dev -> test -> main"; exit 1 ;;
          esac
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  repository-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          version: v0.74.0
  dockerfile-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with: {recursive: true}
  backend-validation:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt -c backend/constraints.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m compileall -q backend/app backend/tests
      - run: python -m pytest -q
        working-directory: backend
  frontend-validation:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
  cube-validation:
    needs: changes
    if: needs.changes.outputs.cube == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check cube/cube.js
      - run: bash -n cube/portal-entrypoint.sh
  container-image-check:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.cube == 'true'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    env:
      LOCAL_IMAGE: local/${{ matrix.component }}:${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.component }}

      - name: Scan built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          version: v0.74.0

      - name: Remove local image
        if: always()
        run: docker image rm "$LOCAL_IMAGE" 2>/dev/null || true
