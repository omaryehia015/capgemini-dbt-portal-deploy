# Deploy repo PRs: promotion path and secrets. The stack itself is validated
# and smoke-tested by e2e-smoke.yml, which also runs on every PR.
name: Pull Request Pre-Check
on:
  pull_request:
    branches: [dev, test, main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: pre-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  promotion-path:
    runs-on: ubuntu-24.04
    steps:
      - env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BASE:$HEAD" in
            dev:feature/*|dev:feat/*|dev:bugfix/*|dev:fix/*|dev:hotfix/*|dev:chore/*|dev:dependabot/*|dev:renovate/*|dev:release/*) ;;
            test:dev|main:test) ;;
            *) echo "::error::Invalid promotion $HEAD -> $BASE. Required path: working branch -> dev -> test -> main"; exit 1 ;;
          esac
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  shell-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck -S warning deploy/client/setup.sh
