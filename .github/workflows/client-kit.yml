# Package the client kit for a portal release: everything a client needs to
# run the stack, nothing else (no source, no build). Runs when a release is
# added to releases.yml on main, or on demand for any release in it.
#
#   dbt-portal-client-kit-<release>.zip
#     compose.yaml  compose.single.yaml  .env.example  releases.yml
#     postgres/upgrade.sh
#     setup.sh  setup.ps1  manage.sh  manage.ps1  lib.sh  lib.ps1
#     install.sh  install.ps1  portal.answers.example  README.md
#     portal.sh  release-tags.sh                       (Kubernetes: Helm commands, release tags)
#     deploy/helm/dbt-portal/                          (the Helm chart of the release)
#   Built by scripts/build-kit.sh. The kit has no build overlay: images are always pulled.
#
# Attached to a GitHub release named portal-<release> in this repo, with the
# Windows launcher (Install-DbtPortal.cmd: double-click, a window does the rest).
# The Helm chart is also pushed to GHCR as an OCI artifact (oci://ghcr.io/<owner>/charts/dbt-portal,
# version = the release's name), the `chart` job below.
name: Client Kit

on:
  push:
    branches: [main]
    paths: [releases.yml]
  workflow_dispatch:
    inputs:
      release:
        description: "Release from releases.yml (default: latest)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  kit:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.kit.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - name: Build the kit
        id: kit
        env:
          WANTED: ${{ inputs.release }}
        run: |
          set -euo pipefail
          release=$(python3 -c "
          import os, yaml
          r = yaml.safe_load(open('releases.yml'))
          name = os.environ.get('WANTED') or r['latest']
          assert name in r['releases'], f'{name} is not in releases.yml'
          print(name)")
          kit="dbt-portal-client-kit-$release"
          # What goes in the kit (compose files, scripts, the Helm chart, this release's tags) is
          # scripts/build-kit.sh, which scripts/validate.sh also builds and checks.
          bash scripts/build-kit.sh "$release" .
          zip -qr "$kit.zip" "$kit"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "zip=$kit.zip" >> "$GITHUB_OUTPUT"
      - name: Publish on a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.kit.outputs.release }}
          ZIP: ${{ steps.kit.outputs.zip }}
        run: |
          tag="portal-$RELEASE"
          notes=$(python3 -c "
          import yaml; x = yaml.safe_load(open('releases.yml'))['releases']['$RELEASE']
          print(f\"backend {x['backend']}, frontend {x['frontend']}, cube {x['cube']}\n\n{x.get('notes', '')}\")")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP" deploy/client/download/Install-DbtPortal.cmd --clobber
          else
            gh release create "$tag" "$ZIP" deploy/client/download/Install-DbtPortal.cmd --title "Portal $RELEASE" --notes "$notes"
          fi

  # The Helm chart as an OCI artifact, next to the kit, so a cluster can install it without the zip:
  #   helm install portal oci://ghcr.io/<owner>/charts/dbt-portal --version <release> -f my-values.yaml
  # The chart version is the release's name (so --version <release> finds it); appVersion is too, as in the kit.
  # The package is private like the images until its visibility is changed in the GitHub package
  # settings; clients sign in with the same token they pull the images with.
  chart:
    needs: kit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Package and push the chart
        env:
          RELEASE: ${{ needs.kit.outputs.release }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p "$RUNNER_TEMP/chart"
          helm package deploy/helm/dbt-portal --version "$RELEASE" --app-version "$RELEASE" --destination "$RUNNER_TEMP/chart"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/dbt-portal-$RELEASE.tgz" "oci://ghcr.io/$owner/charts"
          # Read it back from the registry: what a client will get.
          helm show chart "oci://ghcr.io/$owner/charts/dbt-portal" --version "$RELEASE" | tee "$RUNNER_TEMP/shown.yaml"
          grep -q "^version: $RELEASE$" "$RUNNER_TEMP/shown.yaml"
          echo "Chart: \`oci://ghcr.io/$owner/charts/dbt-portal\` version \`$RELEASE\`" >> "$GITHUB_STEP_SUMMARY"
