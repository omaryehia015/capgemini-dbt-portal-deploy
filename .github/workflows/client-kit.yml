# Package the client kit for a portal release: everything a client needs to
# run the stack, nothing else (no source, no build). Runs when a release is
# added to releases.yml on main, or on demand for any release in it.
#
#   dbt-portal-client-kit-<release>.zip
#     compose.yaml  compose.single.yaml  .env.example  releases.yml
#     postgres/upgrade.sh
#     setup.sh  setup.ps1  manage.sh  manage.ps1  lib.sh  lib.ps1
#     install.sh  install.ps1  portal.answers.example  README.md
#
# Attached to a GitHub release named portal-<release> in this repo, with the
# Windows installer (Install-DbtPortal.cmd: double-click, a window does the rest).
name: Client Kit

on:
  push:
    branches: [main]
    paths: [releases.yml]
  workflow_dispatch:
    inputs:
      release:
        description: "Release from releases.yml (default: latest)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  kit:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.kit.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - name: Build the kit
        id: kit
        env:
          WANTED: ${{ inputs.release }}
        run: |
          set -euo pipefail
          release=$(python3 -c "
          import os, yaml
          r = yaml.safe_load(open('releases.yml'))
          name = os.environ.get('WANTED') or r['latest']
          assert name in r['releases'], f'{name} is not in releases.yml'
          print(name)")
          kit="dbt-portal-client-kit-$release"
          mkdir -p "$kit/postgres"
          cp compose.yaml compose.single.yaml .env.example releases.yml "$kit/"
          cp postgres/upgrade.sh "$kit/postgres/"
          for f in setup.sh setup.ps1 manage.sh manage.ps1 lib.sh lib.ps1 install.sh install.ps1                    portal.answers.example README.md; do
            cp "deploy/client/$f" "$kit/"
          done
          chmod +x "$kit"/*.sh
          # The kit's .env.example starts on this release's images.
          read -r backend frontend cube < <(python3 -c "
          import yaml; x = yaml.safe_load(open('releases.yml'))['releases']['$release']
          print(x['backend'], x['frontend'], x['cube'])")
          sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=$backend/; s/^FRONTEND_TAG=.*/FRONTEND_TAG=$frontend/; s/^CUBE_TAG=.*/CUBE_TAG=$cube/" "$kit/.env.example"
          zip -qr "$kit.zip" "$kit"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "zip=$kit.zip" >> "$GITHUB_OUTPUT"
      - name: Publish on a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.kit.outputs.release }}
          ZIP: ${{ steps.kit.outputs.zip }}
        run: |
          tag="portal-$RELEASE"
          notes=$(python3 -c "
          import yaml; x = yaml.safe_load(open('releases.yml'))['releases']['$RELEASE']
          print(f\"backend {x['backend']}, frontend {x['frontend']}, cube {x['cube']}\n\n{x.get('notes', '')}\")")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP" deploy/client/download/Install-DbtPortal.cmd --clobber
          else
            gh release create "$tag" "$ZIP" deploy/client/download/Install-DbtPortal.cmd --title "Portal $RELEASE" --notes "$notes"
          fi

  # DbtPortalSetup.exe: the Windows app clients download. Published only when a
  # code-signing certificate is configured: managed Windows machines block and
  # remove an unsigned .exe that starts PowerShell. Secrets: CODESIGN_PFX_BASE64
  # (the .pfx, base64) and CODESIGN_PASSWORD.
  app:
    needs: kit
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Build, sign and attach the app
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.kit.outputs.release }}
          PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX) {
            Write-Host "::notice::No code-signing certificate configured: DbtPortalSetup.exe is not published (clients use Install-DbtPortal.cmd)."
            exit 0
          }
          .\deploy\client\installer\build.ps1 -Out out
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:PFX_PASSWORD out\DbtPortalSetup.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item $pfx
          gh release upload "portal-$env:RELEASE" out\DbtPortalSetup.exe --clobber
