# Browser smoke test of a whole portal stack, from published images: sign in,
# run a dbt command (it lands on a worker), see it in the run history.
#
# Runs on:
#   - a component release (repository_dispatch from the backend, frontend or
#     cube repo): the new version, with the other two from releases.yml's latest
#   - a PR to this repo (compose, k8s, releases.yml changes): releases.yml's latest
#   - on demand, with any tags
# A combination that passes can be added to releases.yml as a release.
#
# Pulling the private images needs GHCR_READ_TOKEN (a token with
# read:packages), unless the packages grant this repo read access.
name: E2E Smoke

on:
  repository_dispatch:
    types: [component-released]
  pull_request:
    branches: [dev, test, main]
  workflow_dispatch:
    inputs:
      backend_tag: { description: "backend tag (default: releases.yml latest)", required: false, type: string }
      frontend_tag: { description: "frontend tag", required: false, type: string }
      cube_tag: { description: "cube tag", required: false, type: string }

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event.client_payload.component || 'all' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Compose files and manifests parse
        run: |
          cp .env.example .env
          for k in JWT_SECRET CUBE_API_SECRET POSTGRES_PASSWORD REDIS_PASSWORD; do sed -i "s|^$k=.*|$k=x|" .env; done
          docker compose -f compose.yaml config -q
          docker compose -f compose.single.yaml config -q
          docker compose -f compose.yaml -f compose.build.yaml config -q
          cp deploy/kubernetes/secrets.env.example deploy/kubernetes/secrets.env
          kubectl kustomize deploy/kubernetes >/dev/null
          python3 -c "import yaml; r=yaml.safe_load(open('releases.yml')); assert r['latest'] in r['releases']"
          bash -n deploy/client/setup.sh

  smoke:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        stack: [compose.yaml, compose.single.yaml]
    env:
      # Development mode gives the documented seed passwords the test signs in with.
      ENVIRONMENT: development
      PORTAL_PORT: "8080"
      PREFLIGHT_ON_START: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Pick versions
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          VERSION: ${{ github.event.client_payload.version }}
          IN_BACKEND: ${{ inputs.backend_tag }}
          IN_FRONTEND: ${{ inputs.frontend_tag }}
          IN_CUBE: ${{ inputs.cube_tag }}
        run: |
          set -euo pipefail
          read -r backend frontend cube < <(python3 -c "
          import yaml; r = yaml.safe_load(open('releases.yml')); x = r['releases'][r['latest']]
          print(x['backend'], x['frontend'], x['cube'])")
          case "${COMPONENT:-}" in backend) backend=$VERSION ;; frontend) frontend=$VERSION ;; cube) cube=$VERSION ;; esac
          backend=${IN_BACKEND:-$backend}; frontend=${IN_FRONTEND:-$frontend}; cube=${IN_CUBE:-$cube}
          echo "Testing backend $backend, frontend $frontend, cube $cube" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "BACKEND_TAG=$backend"; echo "FRONTEND_TAG=$frontend"; echo "CUBE_TAG=$cube"
            echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # A minimal dbt project for the workspace, so the Runner has something to run.
      - name: Create a sample dbt project and .env
        run: |
          mkdir -p "$RUNNER_TEMP/project/models"
          printf 'name: smoke\nversion: "1.0.0"\nprofile: smoke\n' > "$RUNNER_TEMP/project/dbt_project.yml"
          printf 'select 1 as id\n' > "$RUNNER_TEMP/project/models/one.sql"
          {
            echo "DBT_PROJECT_PATH=$RUNNER_TEMP/project"
            echo "PORTAL_USER=0:0"
            for k in JWT_SECRET CUBE_API_SECRET POSTGRES_PASSWORD REDIS_PASSWORD; do echo "$k=$(openssl rand -hex 24)"; done
          } > .env

      # "denied" here means this workflow cannot read the private images: add a
      # GHCR_READ_TOKEN secret (classic token, read:packages), or give this repo
      # read access in each package's settings (Manage Actions access).
      - name: Pull the images
        run: |
          docker compose -f "${{ matrix.stack }}" pull 2>&1 | tee pull.log   # pipefail: fails with the pull
        shell: bash

      - name: Explain a denied pull
        if: failure() && hashFiles('pull.log') != ''
        run: |
          if grep -q denied pull.log; then
            echo "::error::GHCR denied the pull. Add a GHCR_READ_TOKEN secret to this repo (classic token with read:packages), or add this repo under Manage Actions access in each capgemini-dbt-portal-* package's settings."
          fi

      - name: Start the stack
        run: docker compose -f "${{ matrix.stack }}" up -d --wait --wait-timeout 600

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Run smoke test
        working-directory: e2e
        env:
          PORTAL_URL: http://localhost:8080
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Every service reports the same release
        if: matrix.stack == 'compose.yaml'
        run: curl -fsS http://localhost:8080/api/version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: failure()
        run: docker compose -f "${{ matrix.stack }}" logs --tail 200

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: e2e/playwright-report
          retention-days: 7
