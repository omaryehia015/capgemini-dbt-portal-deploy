name: Publish Container Images
on:
  push:
    branches: [dev, test, main]
  workflow_dispatch:
    inputs:
      target_environment:
        required: true
        type: choice
        options: [dev, test, prod]
      git_ref:
        required: true
        type: string
        default: main
      component:
        required: true
        type: choice
        options: [all, backend, frontend, cube]
        default: all
      extra_pip_packages:
        required: false
        type: string
        default: ""
permissions:
  contents: read
  packages: write
  pull-requests: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      ref: ${{ steps.plan.outputs.ref }}
      sha: ${{ steps.plan.outputs.sha }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      cube: ${{ steps.plan.outputs.cube }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.sha }}
          fetch-depth: 2
      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend: ['backend/**', 'ruff.toml', '.trivyignore', '.github/workflows/**']
            frontend: ['frontend/**', '.trivyignore', '.github/workflows/**']
            cube: ['cube/**', '.trivyignore', '.github/workflows/**']
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          M_ENV: ${{ inputs.target_environment }}
          M_REF: ${{ inputs.git_ref }}
          M_COMPONENT: ${{ inputs.component }}
          B: ${{ steps.filter.outputs.backend }}
          F: ${{ steps.filter.outputs.frontend }}
          C: ${{ steps.filter.outputs.cube }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=12 HEAD)
          if [[ "$EVENT" == workflow_dispatch ]]; then
            environment="$M_ENV"; ref="$M_REF"
            [[ "$M_COMPONENT" == all || "$M_COMPONENT" == backend ]] && B=true || B=false
            [[ "$M_COMPONENT" == all || "$M_COMPONENT" == frontend ]] && F=true || F=false
            [[ "$M_COMPONENT" == all || "$M_COMPONENT" == cube ]] && C=true || C=false
          else
            ref="$GITHUB_SHA"
            case "$BRANCH" in dev) environment=dev;; test) environment=test;; main) environment=prod;; *) exit 1;; esac
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "backend=${B:-false}" >> "$GITHUB_OUTPUT"
          echo "frontend=${F:-false}" >> "$GITHUB_OUTPUT"
          echo "cube=${C:-false}" >> "$GITHUB_OUTPUT"
  backend:
    needs: prepare
    if: needs.prepare.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-container.yml
    with:
      component: backend
      context: ./backend
      checkout_ref: ${{ needs.prepare.outputs.ref }}
      environment_name: ${{ needs.prepare.outputs.environment }}
      image_tag: ${{ needs.prepare.outputs.environment }}-${{ needs.prepare.outputs.sha }}
      push_image: true
      build_args: |
        EXTRA_PIP_PACKAGES=${{ inputs.extra_pip_packages || '' }}
    secrets: inherit
  frontend:
    needs: prepare
    if: needs.prepare.outputs.frontend == 'true'
    uses: ./.github/workflows/reusable-container.yml
    with:
      component: frontend
      context: ./frontend
      checkout_ref: ${{ needs.prepare.outputs.ref }}
      environment_name: ${{ needs.prepare.outputs.environment }}
      image_tag: ${{ needs.prepare.outputs.environment }}-${{ needs.prepare.outputs.sha }}
      push_image: true
    secrets: inherit
  cube:
    needs: prepare
    if: needs.prepare.outputs.cube == 'true'
    uses: ./.github/workflows/reusable-container.yml
    with:
      component: cube
      context: ./cube
      checkout_ref: ${{ needs.prepare.outputs.ref }}
      environment_name: ${{ needs.prepare.outputs.environment }}
      image_tag: ${{ needs.prepare.outputs.environment }}-${{ needs.prepare.outputs.sha }}
      push_image: true
    secrets: inherit
