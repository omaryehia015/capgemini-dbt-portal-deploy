# Builds the two images a client actually runs (see deploy/client/) and, outside
# pull requests, publishes them to GitHub Container Registry:
#
#   ghcr.io/<owner>/<repo>-backend
#   ghcr.io/<owner>/<repo>-frontend
#
# Triggers:
#   - pull request to dev,   -> build only (proves the Dockerfiles and the
#     uat or main              frontend's tsc + vite build still work); no push
#   - push to main           -> publishes :latest, :main and :sha-<short>
#   - push a tag v1.2.3      -> publishes :1.2.3, :1.2 and :1
#   - manual run             -> publishes :<branch> and :sha-<short>
#
# First-time setup: none. GITHUB_TOKEN already has permission to push to this
# repo's own GHCR namespace. Package visibility defaults to private; make it
# public from the package's GitHub settings once clients should
# `docker compose pull` without authenticating first.
#
# Trivy scans every image before it is pushed, on pull requests too, and fails
# the run on a HIGH or CRITICAL vulnerability that has a fix available. A
# finding that cannot be fixed yet (or is a false positive) goes in .trivyignore
# with a comment saying why and until when.
name: Publish images

on:
  pull_request:
    branches: [dev, uat, main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      extra_pip_packages:
        description: 'Extra backend build arg, e.g. "dbt-bigquery~=1.8.0" for a non-Snowflake image variant'
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# A newer push to the same branch/PR supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7

      # Image names must be lowercase; repository names need not be.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Build once into the local image store, scan it, and only then push, so a
      # vulnerable image never reaches the registry.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: local/${{ matrix.name }}:scan
          build-args: |
            EXTRA_PIP_PACKAGES=${{ matrix.name == 'backend' && github.event.inputs.extra_pip_packages || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - id: build
        name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the backend takes this arg (the frontend Dockerfile ignores it).
          build-args: |
            EXTRA_PIP_PACKAGES=${{ matrix.name == 'backend' && github.event.inputs.extra_pip_packages || '' }}
          # Same inputs as the scanned build, so every layer comes from its cache.
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.name }} published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "Client install: deploy/client/ (set IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,} in .env)"
          } >> "$GITHUB_STEP_SUMMARY"
