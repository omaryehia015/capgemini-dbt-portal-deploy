name: Publish Container Images (Reusable)
on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      component:
        required: false
        type: string
        default: all
      extra_pip_packages:
        required: false
        type: string
        default: ""
permissions:
  contents: read
  packages: write
  pull-requests: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      ref: ${{ steps.plan.outputs.ref }}
      sha: ${{ steps.plan.outputs.sha }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      cube: ${{ steps.plan.outputs.cube }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 2
      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend: ['backend/**', 'ruff.toml', '.trivyignore']
            frontend: ['frontend/**', '.trivyignore']
            cube: ['cube/**', '.trivyignore']
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          M_ENV: ${{ inputs.target_environment }}
          M_REF: ${{ inputs.source_ref }}
          M_COMPONENT: ${{ inputs.component }}
          B: ${{ steps.filter.outputs.backend }}
          F: ${{ steps.filter.outputs.frontend }}
          C: ${{ steps.filter.outputs.cube }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=12 HEAD)
          environment="$M_ENV"; ref="$M_REF"
          if [[ "$EVENT" == workflow_dispatch ]]; then
            case "$M_COMPONENT" in all|backend|frontend|cube) ;; *) echo "::error::Invalid component: $M_COMPONENT"; exit 1 ;; esac
            [[ "$M_COMPONENT" == all || "$M_COMPONENT" == backend ]] && B=true || B=false
            [[ "$M_COMPONENT" == all || "$M_COMPONENT" == frontend ]] && F=true || F=false
            [[ "$M_COMPONENT" == all || "$M_COMPONENT" == cube ]] && C=true || C=false
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "backend=${B:-false}" >> "$GITHUB_OUTPUT"
          echo "frontend=${F:-false}" >> "$GITHUB_OUTPUT"
          echo "cube=${C:-false}" >> "$GITHUB_OUTPUT"
  backend:
    needs: prepare
    if: needs.prepare.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-container.yml
    with:
      component: backend
      context: ./backend
      checkout_ref: ${{ needs.prepare.outputs.ref }}
      environment_name: ${{ needs.prepare.outputs.environment }}
      image_tag: ${{ needs.prepare.outputs.environment }}-${{ needs.prepare.outputs.sha }}
      push_image: true
      tag_latest: ${{ needs.prepare.outputs.environment == 'prod' }}
      build_args: |
        EXTRA_PIP_PACKAGES=${{ inputs.extra_pip_packages || '' }}
    secrets: inherit
  frontend:
    needs: prepare
    if: needs.prepare.outputs.frontend == 'true'
    uses: ./.github/workflows/reusable-container.yml
    with:
      component: frontend
      context: ./frontend
      checkout_ref: ${{ needs.prepare.outputs.ref }}
      environment_name: ${{ needs.prepare.outputs.environment }}
      image_tag: ${{ needs.prepare.outputs.environment }}-${{ needs.prepare.outputs.sha }}
      push_image: true
      tag_latest: ${{ needs.prepare.outputs.environment == 'prod' }}
    secrets: inherit
  cube:
    needs: prepare
    if: needs.prepare.outputs.cube == 'true'
    uses: ./.github/workflows/reusable-container.yml
    with:
      component: cube
      context: ./cube
      checkout_ref: ${{ needs.prepare.outputs.ref }}
      environment_name: ${{ needs.prepare.outputs.environment }}
      image_tag: ${{ needs.prepare.outputs.environment }}-${{ needs.prepare.outputs.sha }}
      push_image: true
      tag_latest: ${{ needs.prepare.outputs.environment == 'prod' }}
    secrets: inherit
