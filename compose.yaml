# Production-like stack: nginx (SPA + reverse proxy) -> FastAPI backend.
# Only the frontend port is published; the backend is reachable solely over
# the internal network, same as it would be behind an ingress.
#
#   podman compose up --build -d
#   http://localhost:8080
#
# Client onboarding (project source, profiles, adapters): docs/ONBOARDING.md
services:
  backend:
    build:
      context: ./backend
      args:
        # Other warehouses / a pinned dbt version, e.g. "dbt-bigquery~=1.8.0".
        EXTRA_PIP_PACKAGES: ${EXTRA_PIP_PACKAGES:-}
    image: capgemini-dbt-portal-backend:local
    restart: unless-stopped
    # Non-root by default. Windows/macOS bind mounts (Podman/Docker Desktop) show
    # every file as root-owned and refuse chmod/utime from other users, which
    # makes `dbt deps` fail ("Operation not permitted"). Set PORTAL_USER=0:0
    # on those hosts (capgemini_dbt_core's scripts/portal.py always runs as root).
    user: "${PORTAL_USER:-10001:10001}"
    env_file:
      - .env
    environment:
      DBT_PROJECT_DIR: /workspace
      # Leave unset and the entrypoint generates one on first start and
      # persists it on the portal_data volume (same secret across restarts,
      # so sessions survive them) -- set it explicitly to pin/rotate it.
      JWT_SECRET: ${JWT_SECRET:-}
      # production (the default) generates a random password per seeded
      # account, printed once in the backend log. "development" seeds the
      # documented demo passwords instead: set it in .env for a local demo only.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CUBE_SHARED_DIR: /cube-shared
      CUBE_API_URL: http://cube:4000
    volumes:
      # The client dbt project the portal runs dbt against. dbt writes
      # target/, logs/ and dbt_packages/ into it, so it is mounted read-write.
      # With DBT_PROJECT_PATH unset this is the named volume `workspace`, which
      # the entrypoint fills from DBT_PROJECT_GIT_URL (git mode).
      - ${DBT_PROJECT_PATH:-workspace}:/workspace
      # Users, roles, audit log and run history (SQLite). Survives rebuilds.
      # Set DATABASE_URL in .env to use PostgreSQL instead.
      - portal_data:/data
      # Written by the backend, read by the cube service: API secret, warehouse
      # login and the semantic data model (see services/cube_manager.py).
      - cube_shared:/cube-shared
    expose:
      - "8000"
    # Declared here rather than only in the Dockerfile: Podman builds OCI
    # images by default, and OCI images silently drop HEALTHCHECK, which
    # would make `depends_on: service_healthy` below never resolve.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      # Git mode clones (and optionally runs dbt deps) before uvicorn starts.
      start_period: 120s
      retries: 3

  # Managed semantic layer (Cube). Internal network only: the backend is its
  # only client. It needs no configuration: the backend writes its warehouse
  # login and data model into cube_shared (Semantic Modeling page > Setup).
  cube:
    build:
      context: ./cube
    image: capgemini-dbt-portal-cube:local
    restart: unless-stopped
    volumes:
      - cube_shared:/cube/conf/portal
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
    image: capgemini-dbt-portal-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    environment:
      # Optional: serve a host:port Airflow webserver under /airflow-ui/ on
      # the portal's origin, e.g. host.containers.internal:8080 (Airflow needs
      # AIRFLOW__WEBSERVER__BASE_URL=http://<portal host>/airflow-ui).
      AIRFLOW_UPSTREAM: ${AIRFLOW_UPSTREAM:-}
    extra_hosts:
      # Docker on Linux has no host alias by default; Podman/Docker Desktop do.
      - "host.docker.internal:host-gateway"

volumes:
  portal_data:
  cube_shared:
  workspace:
