# Capgemini dbt Portal:
#
#   browser -> frontend :8080 (SPA + gateway to the portal API)
#                └─ backend     the portal API: sign-in, dbt runs, schedules, editor,
#                    │          reports, Ask AI, semantic layer  -> postgres (portal)
#                    ├─ worker(s) run the dbt jobs it queues      -> redis (queue, live logs)
#                    └─ cube      the semantic layer engine; reads its config from backend
#
# Host ports: the frontend (PORTAL_PORT, default 8080) and Cube's SQL API, which
# is bound to this machine only (CUBE_SQL_BIND=127.0.0.1) until you open it up.
# Backend, worker, PostgreSQL and Redis are on the internal network only.
#
#   ./scripts/portal.sh init && ./scripts/portal.sh up   # docker or podman, auto-detected
#   ./deploy/client/setup.sh /path/to/dbt-project         # client kit: writes .env, starts it
#   docker compose up -d                                  # afterwards (or: podman compose up -d)
#
# Image versions: BACKEND_TAG / FRONTEND_TAG / CUBE_TAG in .env (releases.yml
# lists the combinations released together; scripts/release-tags.sh prints
# them). Build from the sibling repos instead with compose.build.yaml.
# Full guide: docs/DEPLOYMENT.md and docs/ONBOARDING.md.

# Applied to the four application containers (not to PostgreSQL/Redis, whose
# entrypoints start as root to prepare their data directory). The images run
# as non-root users on ports above 1024, so they need no Linux capability.
# No read-only root filesystem: the backend and the nginx gateway write to
# their home, /tmp and generated config at start.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend: &backend
  <<: *hardened
  image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-backend:${BACKEND_TAG:-latest}
  restart: unless-stopped
  # Only for PORTAL_USER=0:0 (Docker/Podman Desktop bind mounts, see below): root
  # then needs these to write files it does not own. Ineffective for the default
  # non-root user, which has no capabilities either way.
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
  # PORTAL_ENV_FILE: another env file for the containers (scripts/portal.sh --env-file
  # sets it; give compose the same file with --env-file).
  env_file:
    - path: ${PORTAL_ENV_FILE:-.env}
      required: false
  # Non-root by default. Windows/macOS bind mounts (Docker/Podman Desktop) show
  # every file as root-owned and refuse chmod/utime from other users, which
  # makes `dbt deps` fail ("Operation not permitted"): set PORTAL_USER=0:0 there.
  user: "${PORTAL_USER:-10001:10001}"

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set - run deploy/client/setup.sh, or see .env.example}"
  REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set}@redis:6379/0"
  DATABASE_URL: postgresql+psycopg2://portal:${POSTGRES_PASSWORD}@postgres:5432/portal
  DBT_PROJECT_DIR: /workspace
  # A host folder shared with the portal (setup.sh -ProjectsRoot): its path on the
  # host, so the Setup Assistant can take "C:\work\my-project" as typed.
  PORTAL_PROJECTS_HOST: ${PORTAL_PROJECTS_HOST:-}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:17-alpine}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}"
      POSTGRES_DB: portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off, before the backend starts: moves the data of a portal from before
  # 2026.11 (separate identity/execution databases, a semantic_data volume)
  # into the one database and volume. Does nothing on a new or upgraded install.
  #
  # Also hands the backup folder to the backend's user: a new volume, or a host
  # folder Docker created, belongs to root. Done here rather than in upgrade.sh,
  # which an upgrade from an older kit does not replace.
  upgrade:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:17-alpine}
    restart: "no"
    entrypoint: ["sh", "-c", "chown \"$$PORTAL_USER\" /backups 2>/dev/null || true; exec sh /upgrade.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Owner of /data and /backups: the user the backend runs as.
      PORTAL_USER: ${PORTAL_USER:-10001:10001}
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./postgres/upgrade.sh:/upgrade.sh:ro
      - portal_data:/data
      - execution_data:/old-execution-data:ro
      - semantic_data:/old-semantic-data:ro
      - ${PORTAL_BACKUP_DIR:-backups}:/backups

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Job requests carry a one-off provisioning login for a few milliseconds:
    # keep Redis private (internal network, password).
    # Nothing in Redis has to survive a restart (run history is in PostgreSQL, the
    # job queue drains in milliseconds), so persistence is off: REDIS_APPENDONLY=yes
    # turns on the append-only file, kept on the redis_data volume.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "${REDIS_APPENDONLY:-no}", "--save", ""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      # Serve the API; dbt runs on the worker(s).
      EXECUTION_ROLE: api
      # API processes, one CPU core each (API_PROCESSES in .env). Unset: the
      # image's default, 2 in this stack.
      WEB_CONCURRENCY: ${API_PROCESSES:-}
      CUBE_API_SECRET: "${CUBE_API_SECRET:?CUBE_API_SECRET is not set}"
      CUBE_API_URL: http://cube:4000
      # Backups (Users & Access > Backups): BACKUP_KEEP and BACKUP_INTERVAL_HOURS in .env.
      BACKUP_DIR: /backups
      PORTAL_BACKUPS_HOST: ${PORTAL_BACKUPS_HOST:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      upgrade: { condition: service_completed_successfully }
    volumes:
      # The client dbt project. Read-write: the dbt editor saves files, and in
      # git mode (DBT_PROJECT_GIT_URL in .env) this container clones it.
      - ${DBT_PROJECT_PATH:-workspace}:/workspace
      # The host folder shared with the portal, when there is one: projects in it
      # are chosen in the Setup Assistant (an empty volume otherwise).
      - ${DBT_PROJECTS_ROOT:-projects}:/projects
      # The dbt editor's trash, the semantic layer's warehouse login and model.
      - portal_data:/data
      # The portal's backups. setup.sh / setup.ps1 set PORTAL_BACKUP_DIR to a host
      # folder, so deleting the containers or their volumes (down -v, a Docker
      # Desktop / Podman reset) leaves them in place; a second disk or a share is
      # better still. Unset: a volume of its own (Podman does not create a
      # missing host folder, so there is no folder default).
      - ${PORTAL_BACKUP_DIR:-backups}:/backups
    expose: ["8000"]
    # Declared here rather than only in the Dockerfile: Podman builds OCI images
    # by default, and OCI images drop HEALTHCHECK.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    # Lets a running dbt step finish on `down`/`restart` (the worker stops its jobs on SIGTERM).
    stop_grace_period: 120s
    environment:
      <<: *backend-env
      # The backend clones the project in git mode; the worker only mounts it.
      DBT_PROJECT_GIT_URL: ""
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      # Where dbt runs and writes target/, logs/, dbt_packages/.
      - ${DBT_PROJECT_PATH:-workspace}:/workspace
      - ${DBT_PROJECTS_ROOT:-projects}:/projects
      # The key the backend encrypts stored credentials with.
      - portal_data:/data
    # `app.worker --check` only asks Redis to answer a PING (that is what the worker
    # needs to be useful); it does not prove the queue loop is alive.
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  cube:
    <<: *hardened
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-cube:${CUBE_TAG:-latest}
    restart: unless-stopped
    environment:
      CUBEJS_API_SECRET: ${CUBE_API_SECRET}
      PORTAL_SEMANTIC_URL: http://backend:8000
    expose: ["4000"]
    # Cube's SQL API (Postgres protocol) for BI tools, notebooks and AI agents.
    # No shared password: each user makes a login on the Semantic Layer page,
    # and Cube asks the backend to check it on every connection.
    # Published on this machine only. BI tools on other machines: CUBE_SQL_BIND=0.0.0.0
    # (then restrict the port with the host firewall; see docs/DEPLOYMENT.md).
    ports:
      - "${CUBE_SQL_BIND:-127.0.0.1}:${CUBE_SQL_PORT:-15432}:15432"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    <<: *hardened
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      # PORTAL_BIND: 0.0.0.0 (every interface, the shared-server default) or an address
      # such as 127.0.0.1 when a reverse proxy on this host terminates TLS.
      - "${PORTAL_BIND:-0.0.0.0}:${PORTAL_PORT:-8080}:8080"
      # AIRFLOW_UI_PORT publishes the Airflow UI proxy; unset, 8082 gets an
      # unused random host port (nothing listens on it).
      - "${AIRFLOW_UI_PORT:+${AIRFLOW_UI_PORT}:}8082"
    environment:
      BACKEND_UPSTREAM: backend:8000
      # Optional: serve a host:port Airflow webserver so the Airflow page can
      # embed it: under /airflow-ui/ (Airflow needs AIRFLOW__WEBSERVER__BASE_URL=
      # http://<portal host>/airflow-ui) and, with AIRFLOW_UI_PORT, at the root
      # of that port (no Airflow change).
      AIRFLOW_UPSTREAM: ${AIRFLOW_UPSTREAM:-}
      AIRFLOW_UI_PORT: ${AIRFLOW_UI_PORT:-}
    extra_hosts:
      # Docker on Linux has no host alias by default; Podman/Docker Desktop do.
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  # Redis's append-only file, written only with REDIS_APPENDONLY=yes.
  redis_data:
  portal_data:
  # The backups, when PORTAL_BACKUP_DIR names no host folder.
  backups:
  # Read once by `upgrade`: the execution and semantic services' files before 2026.11.
  execution_data:
  semantic_data:
  workspace:
  projects:
