# Capgemini dbt Portal, the microservices stack:
#
#   browser -> frontend :8080 (SPA + gateway: routes each /api prefix to its service)
#                ├─ identity    sign-in, users, roles, audit          -> postgres (portal_identity)
#                ├─ execution   API: dbt runs, schedules, editor, ...  -> postgres (portal_execution)
#                │    └─ worker(s) run the dbt jobs it queues          -> redis (queue, live logs)
#                ├─ insights    Elementary, SQLFluff, profiler, FinOps, Ask AI (read side)
#                └─ semantic    the semantic layer's control plane <- cube reads its config
#
# Only the frontend port is published; everything else is on the internal network.
#
#   ./deploy/client/setup.sh /path/to/dbt-project     # first time: writes .env, starts it
#   docker compose up -d                               # afterwards (or: podman compose up -d)
#
# Image versions: BACKEND_TAG / FRONTEND_TAG / CUBE_TAG in .env (releases.yml
# lists the combinations released together). Build from the sibling repos
# instead with compose.build.yaml. Full guide: docs/ONBOARDING.md.

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set - run deploy/client/setup.sh, or see .env.example}"
  REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set}@redis:6379/0"
  IDENTITY_URL: http://identity:8000
  EXECUTION_URL: http://execution:8000
  INSIGHTS_URL: http://insights:8000
  SEMANTIC_URL: http://semantic:8000
  DBT_PROJECT_DIR: /workspace
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-backend: &backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  # Non-root by default. Windows/macOS bind mounts (Docker/Podman Desktop) show
  # every file as root-owned and refuse chmod/utime from other users, which
  # makes `dbt deps` fail ("Operation not permitted"): set PORTAL_USER=0:0 there.
  user: "${PORTAL_USER:-10001:10001}"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  expose: ["8000"]
  # Declared here rather than only in the Dockerfile: Podman builds OCI images
  # by default, and OCI images drop HEALTHCHECK.
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
    interval: 15s
    timeout: 5s
    start_period: 60s
    retries: 3

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}"
      POSTGRES_DB: portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # One database per service that owns tables.
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    restart: unless-stopped
    # Job requests carry a one-off provisioning login for a few milliseconds:
    # keep Redis private (internal network, password).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  identity:
    <<: *backend
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-identity:${BACKEND_TAG:-latest}
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg2://portal:${POSTGRES_PASSWORD}@postgres:5432/portal_identity

  execution:
    <<: *backend
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-backend:${BACKEND_TAG:-latest}
    environment:
      <<: *backend-env
      PORTAL_SERVICES: execution
      # Serve the API; dbt runs on the worker(s).
      EXECUTION_ROLE: api
      DATABASE_URL: postgresql+psycopg2://portal:${POSTGRES_PASSWORD}@postgres:5432/portal_execution
    volumes:
      # The client dbt project. Read-write: the dbt editor saves files, and in
      # git mode (DBT_PROJECT_GIT_URL in .env) this container clones it.
      - ${DBT_PROJECT_PATH:-workspace}:/workspace
      # The dbt editor's trash.
      - execution_data:/data

  worker:
    <<: *backend
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-backend:${BACKEND_TAG:-latest}
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      PORTAL_SERVICES: execution
      DATABASE_URL: postgresql+psycopg2://portal:${POSTGRES_PASSWORD}@postgres:5432/portal_execution
      # The API container clones the project in git mode; the worker only mounts it.
      DBT_PROJECT_GIT_URL: ""
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      execution: { condition: service_healthy }
    volumes:
      # Where dbt runs and writes target/, logs/, dbt_packages/.
      - ${DBT_PROJECT_PATH:-workspace}:/workspace
    expose: []
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  insights:
    <<: *backend
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-insights:${BACKEND_TAG:-latest}
    environment:
      <<: *backend-env
      DBT_PROJECT_GIT_URL: ""
    depends_on:
      identity: { condition: service_healthy }
      execution: { condition: service_healthy }
    volumes:
      # Reads what dbt runs produce (target/, edr_target/) and the warehouse login.
      - ${DBT_PROJECT_PATH:-workspace}:/workspace:ro

  semantic:
    <<: *backend
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-semantic:${BACKEND_TAG:-latest}
    environment:
      <<: *backend-env
      DBT_PROJECT_GIT_URL: ""
      CUBE_API_SECRET: "${CUBE_API_SECRET:?CUBE_API_SECRET is not set}"
      CUBE_API_URL: http://cube:4000
    depends_on:
      identity: { condition: service_healthy }
      execution: { condition: service_healthy }
    volumes:
      # Reads the dbt manifest and profile.
      - ${DBT_PROJECT_PATH:-workspace}:/workspace:ro
      # The warehouse login and data model Cube is served.
      - semantic_data:/data

  cube:
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-cube:${CUBE_TAG:-latest}
    restart: unless-stopped
    environment:
      CUBEJS_API_SECRET: ${CUBE_API_SECRET}
      PORTAL_SEMANTIC_URL: http://semantic:8000
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      identity: { condition: service_healthy }
      execution: { condition: service_healthy }
      insights: { condition: service_healthy }
      semantic: { condition: service_healthy }
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    environment:
      IDENTITY_UPSTREAM: identity:8000
      EXECUTION_UPSTREAM: execution:8000
      INSIGHTS_UPSTREAM: insights:8000
      SEMANTIC_UPSTREAM: semantic:8000
      # Optional: serve a host:port Airflow webserver under /airflow-ui/ on
      # the portal's origin (Airflow needs AIRFLOW__WEBSERVER__BASE_URL=http://<portal host>/airflow-ui).
      AIRFLOW_UPSTREAM: ${AIRFLOW_UPSTREAM:-}
    extra_hosts:
      # Docker on Linux has no host alias by default; Podman/Docker Desktop do.
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  execution_data:
  semantic_data:
  workspace:
