# Capgemini dbt Portal:
#
#   browser -> frontend :8080 (SPA + gateway to the portal API)
#                └─ backend     the portal API: sign-in, dbt runs, schedules, editor,
#                    │          reports, Ask AI, semantic layer  -> postgres (portal)
#                    ├─ worker(s) run the dbt jobs it queues      -> redis (queue, live logs)
#                    └─ cube      the semantic layer engine; reads its config from backend
#
# Only the frontend port is published; everything else is on the internal network.
#
#   ./deploy/client/setup.sh /path/to/dbt-project     # first time: writes .env, starts it
#   docker compose up -d                               # afterwards (or: podman compose up -d)
#
# Image versions: BACKEND_TAG / FRONTEND_TAG / CUBE_TAG in .env (releases.yml
# lists the combinations released together). Build from the sibling repos
# instead with compose.build.yaml. Full guide: docs/ONBOARDING.md.

x-backend: &backend
  image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-backend:${BACKEND_TAG:-latest}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  # Non-root by default. Windows/macOS bind mounts (Docker/Podman Desktop) show
  # every file as root-owned and refuse chmod/utime from other users, which
  # makes `dbt deps` fail ("Operation not permitted"): set PORTAL_USER=0:0 there.
  user: "${PORTAL_USER:-10001:10001}"

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set - run deploy/client/setup.sh, or see .env.example}"
  REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set}@redis:6379/0"
  DATABASE_URL: postgresql+psycopg2://portal:${POSTGRES_PASSWORD}@postgres:5432/portal
  DBT_PROJECT_DIR: /workspace
  # A host folder shared with the portal (setup.sh -ProjectsRoot): its path on the
  # host, so the Setup Assistant can take "C:\work\my-project" as typed.
  PORTAL_PROJECTS_HOST: ${PORTAL_PROJECTS_HOST:-}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}"
      POSTGRES_DB: portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off, before the backend starts: moves the data of a portal from before
  # 2026.11 (separate identity/execution databases, a semantic_data volume)
  # into the one database and volume. Does nothing on a new or upgraded install.
  upgrade:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:17-alpine}
    restart: "no"
    entrypoint: ["sh", "/upgrade.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Owner of /data: the user the backend runs as.
      PORTAL_USER: ${PORTAL_USER:-10001:10001}
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./postgres/upgrade.sh:/upgrade.sh:ro
      - portal_data:/data
      - execution_data:/old-execution-data:ro
      - semantic_data:/old-semantic-data:ro

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    restart: unless-stopped
    # Job requests carry a one-off provisioning login for a few milliseconds:
    # keep Redis private (internal network, password).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      # Serve the API; dbt runs on the worker(s).
      EXECUTION_ROLE: api
      CUBE_API_SECRET: "${CUBE_API_SECRET:?CUBE_API_SECRET is not set}"
      CUBE_API_URL: http://cube:4000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      upgrade: { condition: service_completed_successfully }
    volumes:
      # The client dbt project. Read-write: the dbt editor saves files, and in
      # git mode (DBT_PROJECT_GIT_URL in .env) this container clones it.
      - ${DBT_PROJECT_PATH:-workspace}:/workspace
      # The host folder shared with the portal, when there is one: projects in it
      # are chosen in the Setup Assistant (an empty volume otherwise).
      - ${DBT_PROJECTS_ROOT:-projects}:/projects
      # The dbt editor's trash, the semantic layer's warehouse login and model.
      - portal_data:/data
    expose: ["8000"]
    # Declared here rather than only in the Dockerfile: Podman builds OCI images
    # by default, and OCI images drop HEALTHCHECK.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      # The backend clones the project in git mode; the worker only mounts it.
      DBT_PROJECT_GIT_URL: ""
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      # Where dbt runs and writes target/, logs/, dbt_packages/.
      - ${DBT_PROJECT_PATH:-workspace}:/workspace
      - ${DBT_PROJECTS_ROOT:-projects}:/projects
      # The key the backend encrypts stored credentials with.
      - portal_data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  cube:
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-cube:${CUBE_TAG:-latest}
    restart: unless-stopped
    environment:
      CUBEJS_API_SECRET: ${CUBE_API_SECRET}
      PORTAL_SEMANTIC_URL: http://backend:8000
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/omaryehia015}/capgemini-dbt-portal-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    environment:
      BACKEND_UPSTREAM: backend:8000
      # Optional: serve a host:port Airflow webserver under /airflow-ui/ on
      # the portal's origin (Airflow needs AIRFLOW__WEBSERVER__BASE_URL=http://<portal host>/airflow-ui).
      AIRFLOW_UPSTREAM: ${AIRFLOW_UPSTREAM:-}
    extra_hosts:
      # Docker on Linux has no host alias by default; Podman/Docker Desktop do.
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  portal_data:
  # Read once by `upgrade`: the execution and semantic services' files before 2026.11.
  execution_data:
  semantic_data:
  workspace:
  projects:
