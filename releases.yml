# Portal releases: which versions of the three repos were tested together.
#
#   backend   capgemini-dbt-portal-backend (one image: the portal API and the
#             workers; up to 2026.10 also -identity, -insights, -semantic)
#   frontend  capgemini-dbt-portal-frontend
#   cube      capgemini-dbt-portal-cube
#
# A deployment pins one release: deploy/client/setup.sh --release <name>
# writes its tags into .env (BACKEND_TAG, FRONTEND_TAG, CUBE_TAG), and
# capgemini_dbt_core's scripts/portal.py --release does the same.
#
# Each repo releases on its own (vX.Y.Z tag -> images X.Y.Z, X.Y, latest).
# A new entry here is added once the e2e smoke test passes on that
# combination (.github/workflows/e2e-smoke.yml). Compatibility rules:
#   - frontend and backend: the frontend checks GET /api/version's api_version
#     major against its own and warns on a mismatch
#   - backend and cube: the cube image's CUBE_CONTRACT must equal the
#     backend's contract (GET /api/version, cube_contract)
latest: "2026.10.7"
releases:
  "2026.10.7":
    backend: "1.3.0"
    frontend: "1.3.0"
    cube: "1.0.1"
    notes: >-
      Ask AI answers in full (no more "answer truncated" through a GenAI
      gateway) and shows each lookup live, with a Stop button. Two tabs: Data
      Governance (lineage, failing tests and their root causes, documentation,
      test and ownership coverage) and Data Marts & KPIs, which answers from
      the semantic layer's governed measures first and SQL on the dbt models
      otherwise, with a chart for each result. Wide chat and follow-up
      questions.
  "2026.10.6":
    backend: "1.2.1"
    frontend: "1.2.0"
    cube: "1.0.1"
    notes: >-
      Fixes dbt runs of a project chosen in the Setup Assistant (a folder on
      this computer or an image): they failed with "No dbt_project.yml found
      at /workspace".
  "2026.10.5":
    backend: "1.2.0"
    frontend: "1.2.0"
    cube: "1.0.1"
    notes: >-
      An optional AI provider is connected in the Setup Assistant (a company
      GenAI gateway, Anthropic, OpenAI or Gemini) instead of the .env file.
      Admins manage every account, the built-in admin and their own
      included. Users & Access has two sections; the sidebar sections fold.
  "2026.10.4":
    backend: "1.1.2"
    frontend: "1.1.1"
    cube: "1.0.1"
    notes: >-
      The dbt project from a container image, on this computer or in a
      registry (Setup Assistant, Docker image). The setup app shares the
      computer's main drive with the portal, so a project folder is linked by
      typing its path, with no commands.
  "2026.10.3":
    backend: "1.1.1"
    frontend: "1.1.0"
    cube: "1.0.1"
    notes: >-
      A lost admin password can be replaced: the setup window offers "Forgot
      the admin password?", and manage reset-password does the same. Running
      the installer again keeps a shared project folder, and the portal moves
      to a free port when another program took its own.
  "2026.10.2":
    backend: "1.1.0"
    frontend: "1.1.0"
    cube: "1.0.1"
    notes: >-
      Set up from the browser: the dbt project (Git, or a folder on this
      computer) and the variables it reads are entered in the Setup Assistant,
      with no .env to maintain. Windows installer: download, paste the token,
      click Install (on Podman it installs inside the Podman machine). Fixes a
      .env that grew on every Windows setup run.
  "2026.10.1":
    backend: "1.0.1"
    frontend: "1.0.0"
    cube: "1.0.1"
    notes: >-
      Fixes from smoke testing 2026.10.0: a new warehouse login or model is
      verified only after Cube has applied it; an identity outage no longer
      signs users out (503, recently seen users keep working); faster
      recovery after a Redis restart.
  "2026.10.0":
    backend: "1.0.0"
    frontend: "1.0.0"
    cube: "1.0.0"
    notes: >-
      First release as separate services: identity, execution (+ workers),
      insights and semantic; PostgreSQL and Redis; Cube configured over HTTP
      instead of a shared volume.
